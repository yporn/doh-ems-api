# reflex.conf (safe single-runner)

# ── SERVER: ใช้ go ใหม่แบบ absolute path, มี kill เก่า, build ใหม่, exec ใหม่
-r (\.go$|go\.mod$|^\.env.*$|^config/.*\.(yaml|yml|json|toml)$) -s -- bash -lc '
  set -e
  pkill -f "bin/doh-ems" || true
  rm -f bin/doh-ems
  mkdir -p bin

  /usr/local/go/bin/go build -trimpath -o bin/doh-ems ./cmd/app

  exec ./bin/doh-ems
'

# ── TESTS: รันเทสต์เมื่อ *_test.go เปลี่ยน (ไม่ยุ่งกับเซิร์ฟเวอร์)
-r _test\.go$ -- bash -lc '
  echo "🧪 $(date +%H:%M:%S) Running tests..."
  go test -v ./...
'